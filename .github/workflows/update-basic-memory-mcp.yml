name: Update basic-memory

# Thin wrapper: all logic lives in .github/workflows/module-update.yml.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
permissions: {}

jobs:
  update:
    uses: ./.github/workflows/module-update.yml
    with:
      module: basic-memory-mcp
      paths: modules/mcp/basic-memory
      command: nix-shell modules/mcp/basic-memory/update.sh
      version-file: modules/mcp/basic-memory/source.json
    secrets: inherit
