name: Update aws-mcp

# Thin wrapper: all logic lives in .github/workflows/module-update.yml.
on:
  schedule:
    - cron: "50 4 * * *"
  workflow_dispatch:
permissions: {}

jobs:
  update:
    uses: ./.github/workflows/module-update.yml
    with:
      module: aws-mcp
      paths: modules/mcp/aws
      command: nix-shell modules/mcp/aws/update.sh
      version-file: modules/mcp/aws/source.json
    secrets: inherit
