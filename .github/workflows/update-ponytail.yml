name: Update ponytail

# Thin wrapper: all logic lives in .github/workflows/module-update.yml.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions: {}

jobs:
  update:
    uses: ./.github/workflows/module-update.yml
    with:
      module: ponytail
      paths: modules/skills/ponytail
      command: nix-shell modules/skills/ponytail/update.sh
      version-file: modules/skills/ponytail/source.json
    secrets: inherit
