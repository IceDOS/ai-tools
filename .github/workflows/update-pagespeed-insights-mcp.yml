name: Update pagespeed-insights-mcp

# Thin wrapper: all logic lives in .github/workflows/module-update.yml.
on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:
permissions: {}

jobs:
  update:
    uses: ./.github/workflows/module-update.yml
    with:
      module: pagespeed-insights-mcp
      paths: modules/mcp/pagespeed-insights
      command: nix-shell modules/mcp/pagespeed-insights/update.sh
      version-file: modules/mcp/pagespeed-insights/source.json
    secrets: inherit
