name: Update superpowers

# Thin wrapper: all logic lives in .github/workflows/module-update.yml.
on:
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:
permissions: {}

jobs:
  update:
    uses: ./.github/workflows/module-update.yml
    with:
      module: superpowers
      paths: modules/skills/superpowers
      command: nix-shell modules/skills/superpowers/update.sh
      version-file: modules/skills/superpowers/source.json
    secrets: inherit
