# Whether `icedos gc` prunes stale claude session data (unshade-style).
[icedos.ai-tools.claude-code]
includeInIcedosGc = false
# Whether Claude Code loads MCP servers from the claude.ai account.
claudeAiMcpServers = false
# Retain session transcripts/history newer than this many days on GC.
sessionRetentionDays = 30
# Whether the launcher shows a desktop entry that opens in the default terminal.
desktopEntry = false
# Arguments added to every claude invocation, e.g. channel flags from agent-relay.
extraArgs = []
# Shared skills Claude Code skips, e.g. ones an installed plugin already ships.
excludeSkills = []

# Custom skills specific to Claude Code (name = SKILL.md).
[icedos.ai-tools.claude-code.skills]

# Terminal title "<glyph> <title>" with a tool timer; glyphs must share one width in the title font.
[icedos.ai-tools.claude-code.terminal-title]
enable = true
idleGlyph = "✳"
workingGlyphs = ["✶", "✷", "✸", "✹"]

[[icedos.ai-tools.claude-code.users.username.marketplaces]]
name = ""
source = ""
owner = ""
repo = ""
url = ""
path = ""
domain = ""
rev = ""
hash = ""
