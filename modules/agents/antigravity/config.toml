[icedos.ai-tools.antigravity.extra-mcp-servers]

# Global rules, name = markdown, written to ~/.config/gemini/rules/<name>.md (agy reads them through the ~/.gemini symlink).
# Text without frontmatter gets `trigger: always_on`. agy truncates a file past 24,000 bytes.
[icedos.ai-tools.antigravity.rules]

# Global skills, name = full SKILL.md content, written to ~/.local/share/gemini/antigravity-cli/skills/<name>/SKILL.md (agy reads them through the ~/.gemini symlink).
[icedos.ai-tools.antigravity.skills]

# Keys of agy's settings.json; Home Manager sets them on activation and launch (null removes).
[icedos.ai-tools.antigravity.settings]

[icedos.ai-tools.antigravity]
# Whether the launcher shows a desktop entry that opens in the default terminal.
desktopEntry = false

# Command prepended to agy in agent-launch and the desktop entry (set by agent-relay).
launchWrapper = []

# Whether to wire Home Manager's shared programs.mcp.servers registry
# into ~/.config/gemini/mcp_config.json for Antigravity (agy reads it through the ~/.gemini symlink).
enableMcpIntegration = true

# Antigravity CLI bottom status bar (/statusline), rendered by alimit like the other agents' bars;
# configured via agy's own settings.json.
statusLine = true

# Render the bar below agy's built-in header instead of replacing it.
statusLineStackWithDefault = false

# Terminal title "<status glyph> <conversation title>", as Claude Code and pi-agent set it
# (Zed terminal threads show the glyph as a status marker). The status line command drives it,
# so it also works with statusLine = false. Use glyphs of one width in the title font.
[icedos.ai-tools.antigravity.terminal-title]
enable = true
idleGlyph = "◉"
workingGlyphs = ["◐", "◓", "◑", "◒"]

[icedos.ai-tools.antigravity.extensions.recursive-language-models]
# rlm plugin: ipython MCP tool whose rlm(prompt, context) runs a child agy; adds /rlm and /refine skills.
enable = false
# Launch agy with --agent rlm (RLM mode) from agent-launch and the desktop entry.
autoload = false
# rlm() recursion limit; 0 turns recursion off.
maxDepth = 2
# Log every child's stream-json under the plugin data dir's children/<conversation>/.
childLog = true
# Per-child agy --print-timeout; "0s" means no limit.
childTimeout = "15m"
# Pickle namespace data per conversation and restore it on resume.
snapshots = true
# Whether icedos gc prunes snapshots, child logs and local harness files older than retentionDays.
includeInIcedosGc = true
retentionDays = 30
