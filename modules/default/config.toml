
# Shared AI agent rules: name = markdown. Every agent module in this repo
# loads them (pi-agent as appended system prompt, antigravity as
# ~/.config/gemini/rules/<name>.md, opencode as ambient context in
# ~/.config/opencode/AGENTS.md), and claude-code gets them as
# ~/.claude/rules/<name>.md. A per-agent rule of the same name wins.
[icedos.ai-tools.rules]

# Shared AI agent skills: name = full SKILL.md content (frontmatter included).
# Written for claude-code, antigravity, pi-agent and opencode. A per-agent
# skill of the same name wins.
[icedos.ai-tools.skills.pool]

# Global plugin storage: name = store path. Agents load ones listed in per-agent.<agent>.globalPlugins.
[icedos.ai-tools.plugins.pool]

# Per-agent overrides: skills, plugins, globalPlugins, and excluded skill names.
[icedos.ai-tools.per-agent.claude-code]
excludeSkills = []
globalPlugins = []
skills = {}
plugins = {}

[icedos.ai-tools.per-agent.antigravity]
excludeSkills = []
globalPlugins = []
skills = {}
plugins = {}

[icedos.ai-tools.per-agent.opencode]
excludeSkills = []
globalPlugins = []
skills = {}
plugins = {}

[icedos.ai-tools.per-agent.pi-agent]
excludeSkills = []
globalPlugins = []
skills = {}
plugins = {}

# Shared MCP server registry: name = server entry (command/args/env or url).
# Each MCP module adds its own. Every hm user gets them in programs.mcp.servers,
# which all agent modules read, and /etc/mcp/servers.json lists them for agents
# outside Home Manager.
[icedos.ai-tools.mcp-servers]

# How the gateway runs each registered server: name = "global" (one process for
# every agent), "per-agent" (one per agent session) or "stdio" (not routed).
# Modules set their own entry as a default, so a value here overrides a shipped
# server (rea = "per-agent") and covers servers you add to mcp-servers yourself.
# Servers added straight to home-manager programs.mcp.servers are not routed.
[icedos.ai-tools.mcp-gateway-modes]
