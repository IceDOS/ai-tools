[icedos.ai-tools.opencart-mcp]
# KEY=value file outside the Nix store for secrets such as OPENCART_DB_PASS.
# "" reads none.
envFile = ""

# Tool-call timeout in milliseconds for agents that honour it.
timeout = 600000

# Skills shipped in ./skills (SKILL.md with references/*.md inlined).
shippedSkills = ["opencart-extension"]

# Plain OPENCART_* settings passed to the server, e.g. OPENCART_SSH_HOST = "ddev"
# for a local DDEV project. Keep secrets in envFile.
[icedos.ai-tools.opencart-mcp.env]

# Extra skills, name = full SKILL.md content; replaces a same-named shipped skill.
# Added to the shared icedos.ai-tools.skills pool.
[icedos.ai-tools.opencart-mcp.skills]
