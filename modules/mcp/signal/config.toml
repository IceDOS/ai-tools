[icedos.ai-tools.signal-mcp]
# Signal number (E.164) of the person the agent talks to. Required.
operator = ""

# Signal number the signal-cli daemon runs as. Empty uses operator.
account = ""

# Recipients the agent may message: numbers, group names or group ids.
trustedRecipients = []

# Senders whose inbound messages reach the agent.
trustedSenders = []

# Port of the local signal-cli JSON-RPC daemon, started on demand.
rpcPort = 7583

# Skills for this module, name = full SKILL.md content. Added to the shared
# icedos.ai-tools.skills pool.
[icedos.ai-tools.signal-mcp.skills]
